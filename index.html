<!doctype html>
<html lang="sl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Vsi lokalni dogodki v Zasavju na enem mestu" />
    <title>Dogodki Zasavje</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header class="top">
      <h1>Dogodki Zasavje</h1>
      <button id="btn-new" class="btn">+ Objavi dogodek</button>
    </header>

    <main>
      <nav class="tabs" id="tabs">
        <button data-view="today" class="active">Danes</button>
        <button data-view="weekend">Ta vikend</button>
        <button data-view="all">Vsi</button>
      </nav>

      <section class="filters" id="filters"></section>
      <p id="status" class="status"></p>
      <section id="events" class="events"></section>
    </main>

    <dialog id="dlg-new"></dialog>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
